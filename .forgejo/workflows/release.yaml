name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_version="${FORGEJO_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag $tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Wait for quality
        run: nix shell nixpkgs#curl nixpkgs#jq -c bash .forgejo/scripts/wait-for-quality.sh

      - name: Build release asset
        run: |
          nix develop .#ci --command just build
          mkdir -p "$RUNNER_TEMP/dist"
          cp target/release/bazel-language-server \
            "$RUNNER_TEMP/dist/bazel-language-server-x86_64-unknown-linux-gnu"

      - name: Publish crate dry run
        run: nix develop .#ci --command cargo publish --dry-run --locked

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          published_version=$(
            nix develop .#ci --command cargo search bazel-language-server --limit 1 \
              | sed -n 's/^bazel-language-server = "\([^"]*\)".*/\1/p'
          )
          if [ "$published_version" = "$crate_version" ]; then
            echo "bazel-language-server $crate_version is already published"
          else
            nix develop .#ci --command cargo publish --locked
          fi

      - name: Configure Forgejo CLI
        run: |
          nix shell nixpkgs#tea -c tea login delete actions || true
          nix shell nixpkgs#tea -c tea login add \
            --name actions \
            --url "$FORGEJO_SERVER_URL" \
            --token "$FORGEJO_TOKEN" \
            --no-version-check

      - name: Replace Forgejo release
        run: |
          asset="$RUNNER_TEMP/dist/bazel-language-server-x86_64-unknown-linux-gnu"
          nix shell nixpkgs#tea -c tea releases delete \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --confirm "$FORGEJO_REF_NAME" || true
          nix shell nixpkgs#tea -c tea releases create \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --tag "$FORGEJO_REF_NAME" \
            --target "$FORGEJO_SHA" \
            --title "$FORGEJO_REF_NAME" \
            --asset "$asset"
