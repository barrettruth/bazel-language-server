name: nightly

on:
  push:
    branches: [main]

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for quality
        run: nix shell nixpkgs#curl nixpkgs#jq -c bash .forgejo/scripts/wait-for-quality.sh

      - name: Build nightly asset
        run: |
          nix develop .#ci --command just build
          mkdir -p "$RUNNER_TEMP/dist"
          cp target/release/bazel-language-server \
            "$RUNNER_TEMP/dist/bazel-language-server-nightly-x86_64-unknown-linux-gnu"

      - name: Move the nightly tag
        run: |
          git tag -f --no-sign nightly "$FORGEJO_SHA"
          git push origin refs/tags/nightly --force

      - name: Configure Forgejo CLI
        run: |
          nix shell nixpkgs#tea -c tea login delete actions || true
          nix shell nixpkgs#tea -c tea login add \
            --name actions \
            --url "$FORGEJO_SERVER_URL" \
            --token "$FORGEJO_TOKEN" \
            --no-version-check

      - name: Replace nightly release
        run: |
          nix shell nixpkgs#tea -c tea releases delete \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --confirm nightly || true
          nix shell nixpkgs#tea -c tea releases create \
            --login actions \
            --repo "$FORGEJO_REPOSITORY" \
            --tag nightly \
            --target "$FORGEJO_SHA" \
            --title nightly \
            --note "Built from ${FORGEJO_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
            --prerelease \
            --asset "$RUNNER_TEMP/dist/bazel-language-server-nightly-x86_64-unknown-linux-gnu"
