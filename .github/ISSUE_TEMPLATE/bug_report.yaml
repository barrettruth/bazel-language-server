name: Bug Report
description: Report a bug
title: 'bug: '
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label:
            I have searched [existing
            issues](https://github.com/barrettruth/bazel-language-server/issues)
          required: true
        - label: I have updated to the latest version
          required: true

  - type: textarea
    attributes:
      label: 'Server version'
      description: 'Output of `bazel-language-server --version`'
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: 'Bazel version'
      description: 'Output of `bazel --version`, or "not installed"'
      render: text
    validations:
      required: true

  - type: input
    attributes:
      label: 'Operating system'
      placeholder: 'e.g. Arch Linux, macOS 15, Ubuntu 24.04'
    validations:
      required: true

  - type: input
    attributes:
      label: 'LSP client'
      placeholder: 'e.g. Neovim 0.12 + nvim-lspconfig, Helix 24.07, VS Code'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 'Workspace layout'
      description: 'Output of `bazel-language-server index .` at the workspace root, which reports how the root was found and what the static tier can see'
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal reproduction
      description: |
        The smallest BUILD file, `.bzl` file or workspace that reproduces the
        problem. Confirm it still reproduces before submitting.
      render: python
      value: |
        filegroup(
            name = "srcs",
            srcs = [],
        )
    validations:
      required: true
