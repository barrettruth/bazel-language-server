[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Barrett Ruth <br@barrettruth.com>"]
license = "MIT"
repository = "https://github.com/barrettruth/bazel-language-server"

[workspace.dependencies]
bls-bazel = { path = "crates/bls-bazel" }
bls-index = { path = "crates/bls-index" }

starlark-cst = { path = "../starlark-cst" }

anyhow = "1"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
lsp-server = "0.10"
lsp-types = { version = "0.11", package = "gen-lsp-types", features = [
  "fluent-uri",
] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[profile.release]
opt-level = 3
